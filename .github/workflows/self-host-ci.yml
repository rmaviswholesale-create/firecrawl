name: Self-host CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-host-ci=${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  self-host:
    name: Self-hosted tests (playwright, no-proxy, no search, no AI, postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      redis:
        image: redis
        ports:
          - 6379:6379
      rabbitmq:
        image: rabbitmq
        ports:
          - 5672:5672
    env:
      HOST: 0.0.0.0
      TEST_SUITE_SELF_HOSTED: true
      TEST_SUITE_WEBSITE: http://127.0.0.1:4321
      TEST_API_KEY: test
      TEST_TEAM_ID: bypass
      SELF_HOSTED_API_KEYS: test
      LOCAL_CACHE_ENABLED: true
      LOCAL_CACHE_DEFAULT_MAX_AGE_MS: 0
      # Short watch schedules so the scheduled-run test finishes quickly.
      WATCH_POLL_INTERVAL_MS: 2000
      WATCH_MIN_INTERVAL_SECONDS: 5
      PLAYWRIGHT_MICROSERVICE_URL: http://localhost:3003/scrape
      NUQ_DATABASE_URL: postgres://postgres:postgres@localhost:5432/postgres
      NUQ_RABBITMQ_URL: amqp://localhost:5672
      FDB_VERSION: 7.3.63
      USE_GO_MARKDOWN_PARSER: true
      ALLOW_LOCAL_WEBHOOKS: true
      FIRECRAWL_LOG_TO_FILE: true
      # Exercise the parse upload-ref path in self-hosted CI. The snips run
      # against a separately started API server, so these must be server envs,
      # not test-process mutations.
      ENV: test
      PARSE_UPLOAD_STORAGE_DRIVER: local
      PARSE_UPLOAD_REF_TEST_REQUIRED: true
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4
        with:
          version: 11.4.0

      # The API statically imports the foundationdb node module, so the client
      # library must be present even though NuQ runs on postgres here.
      - name: Install FoundationDB client library
        run: |
          curl -fsSL -o /tmp/fdb-clients.deb \
            "https://github.com/apple/foundationdb/releases/download/${FDB_VERSION}/foundationdb-clients_${FDB_VERSION}-1_amd64.deb"
          sudo dpkg -i /tmp/fdb-clients.deb

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            apps/api/pnpm-lock.yaml
            apps/test-site/pnpm-lock.yaml
            apps/playwright-service-ts/pnpm-lock.yaml

      - run: pnpm fetch
        working-directory: apps/api
      - run: pnpm fetch
        working-directory: apps/test-site
      - run: pnpm fetch
        working-directory: apps/playwright-service-ts

      - name: Restore native lib
        id: napi_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/api/native/*.node
            apps/api/native/index.js
            apps/api/native/index.d.ts
          key: ${{ runner.os }}-napi-${{ hashFiles('apps/api/native/Cargo.toml', 'apps/api/native/package.json', 'apps/api/native/src/**') }}

      - name: Build native lib
        if: steps.napi_restore.outputs.cache-hit != 'true'
        run: pnpm install
        working-directory: apps/api/native

      - name: Cache native lib
        if: steps.napi_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            apps/api/native/*.node
            apps/api/native/index.js
            apps/api/native/index.d.ts
          key: ${{ steps.napi_restore.outputs.cache-primary-key }}

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.26
          cache-dependency-path: apps/api/sharedLibs/go-html-to-md/go.sum

      - name: Restore Go lib
        id: golib_restore
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/api/sharedLibs/go-html-to-md/libhtml-to-markdown.so
          key: ${{ runner.os }}-golib-${{ hashFiles('apps/api/sharedLibs/go-html-to-md/go.sum', 'apps/api/sharedLibs/go-html-to-md/*.go') }}

      - name: Build go-html-to-md
        if: steps.golib_restore.outputs.cache-hit != 'true'
        run: |
          cd apps/api/sharedLibs/go-html-to-md
          go build -o libhtml-to-markdown.so -buildmode=c-shared html-to-markdown.go

      - name: Cache Go lib
        if: steps.golib_restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: apps/api/sharedLibs/go-html-to-md/libhtml-to-markdown.so
          key: ${{ steps.golib_restore.outputs.cache-primary-key }}

      - name: Restore Playwright cache
        id: pw_cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-${{ runner.arch }}-pw-chromium-${{ hashFiles('apps/playwright-service-ts/pnpm-lock.yaml', 'apps/playwright-service-ts/package.json') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-pw-chromium-

      - name: Install Playwright node modules
        run: pnpm install --frozen-lockfile
        working-directory: ./apps/playwright-service-ts

      - name: Run Playwright service unit tests
        run: pnpm test
        working-directory: ./apps/playwright-service-ts

      - name: Install Playwright system deps
        run: pnpm exec playwright install-deps chromium
        working-directory: ./apps/playwright-service-ts

      - name: Install Playwright Chromium
        if: steps.pw_cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install chromium
        working-directory: ./apps/playwright-service-ts

      - name: Cache Playwright
        if: steps.pw_cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ steps.pw_cache.outputs.cache-primary-key }}

      - name: Install API dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
        working-directory: apps/api
        env:
          npm_config_ignore_scripts: 'true'

      - name: Run self-host unit tests
        run: pnpm exec vitest run src/lib/self-hosted-auth.test.ts src/lib/change-tracking-diff.test.ts --reporter=default
        working-directory: apps/api

      - name: Install test site dependencies
        run: pnpm install --frozen-lockfile
        working-directory: apps/test-site

      - name: Build + serve test site
        run: |
          pnpm build
          pnpm preview --port 4321 --strictPort --host 127.0.0.1 > test-site.log 2>&1 &
          pnpx wait-on tcp:4321 -t 20s
        working-directory: apps/test-site

      - name: Generate parse upload ref secret
        run: echo "PARSE_UPLOAD_REF_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"

      - name: Start playwright
        run: |
          pnpm run dev > playwright.log 2>&1 &
          pnpx wait-on tcp:3003 -t 15s
        working-directory: ./apps/playwright-service-ts
        env:
          PORT: 3003

      - name: Run Docker Postgres
        run: |
          docker build -t firecrawl/nuq-postgres:latest ./apps/nuq-postgres
          docker run -d -p 5432:5432 -e POSTGRES_USER=postgres -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=postgres --name postgres firecrawl/nuq-postgres:latest

      - name: Run tests
        run: >-
          pnpm harness pnpm exec vitest run
          src/__tests__/snips/v2/local-browser.test.ts
          src/__tests__/snips/v2/snapshots.test.ts
          src/__tests__/snips/v2/scrape-focus.test.ts
          src/__tests__/snips/v2/local-cache.test.ts
          src/__tests__/snips/v2/self-hosted-auth.test.ts
          src/__tests__/snips/v2/watch.test.ts
          src/__tests__/snips/v2/scrape.test.ts
          src/__tests__/snips/v2/scrape-formats.test.ts
          src/__tests__/snips/v1/scrape.test.ts
        working-directory: apps/api
        env:
          npm_config_ignore_scripts: 'true' # required currently to prevent re-building cached native lib

      - name: Copy log files
        if: always()
        run: |
          mkdir -p logs
          cp ./apps/api/firecrawl-app.log logs/firecrawl.log || true
          cp ./apps/api/firecrawl-worker.log logs/firecrawl-worker.log || true

      - name: Copy Playwright logs
        if: always()
        run: cp ./apps/playwright-service-ts/playwright.log logs/playwright.log || true

      - name: Zip logs
        if: always()
        run: |
          cd logs
          zip -r logs.zip ./*

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: Logs (self-host, playwright, no-proxy, postgres)
          path: logs/logs.zip
